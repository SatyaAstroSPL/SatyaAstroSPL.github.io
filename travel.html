<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel & Exploration | Satyapriya Das</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=SF+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">SD.</div>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="research.html" class="nav-link">Research</a>
            <a href="links.html" class="nav-link">Links</a>
            <a href="travel.html" class="nav-link active">Travel</a>
            <a href="contact.html" class="nav-link">Contact</a>
        </div>
        <div class="hamburger">
            <div class="line line1"></div>
            <div class="line line2"></div>
            <div class="line line3"></div>
        </div>
    </nav>

    <main class="container" style="padding-top: 120px;">
        <section class="hero">
            <h1>Travel & Exploration</h1>
            <p class="subtitle">Exploring the world, one location at a time.</p>
        </section>

        <section id="gallery">
            <h2 style="color: var(--white); margin-bottom: 30px;">Andaman & Nicobar Islands</h2>
            <div class="travel-grid"
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
                <div class="photo-card" style="border-radius: 8px; overflow: hidden; position: relative;">
                    <img src="assets/Photos_for_background/Beach_pic_andaman.jpg" alt="Andaman Sea Beach"
                        style="width: 100%; height: 300px; object-fit: cover; transition: transform 0.3s ease;">
                    <div class="photo-caption"
                        style="padding: 15px; color: var(--slate); background: var(--light-navy);">Andaman Sea Beach
                    </div>
                </div>
                <div class="photo-card" style="border-radius: 8px; overflow: hidden; position: relative;">
                    <img src="assets/Photos_for_background/Me_embracing_sunset.jpg" alt="Andaman Sunset"
                        style="width: 100%; height: 300px; object-fit: cover; transition: transform 0.3s ease;">
                    <div class="photo-caption"
                        style="padding: 15px; color: var(--slate); background: var(--light-navy);">Sunset Views</div>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="social-links">
            <a href="https://github.com/SatyaAstroSPL" target="_blank"><i class="fab fa-github"></i></a>
            <a href="https://www.linkedin.com/in/satyapriya-das-74209920a" target="_blank"><i
                    class="fab fa-linkedin"></i></a>
        </div>
        <p class="copyright">Designed & Built by Satyapriya Das</p>
    </footer>

    <script src="assets/js/script.js"></script>
